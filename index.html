function wxApply(k,quiet){const d=WXD[k];G.wx={k,t:R(45,95),ev:R(3,6)};G.wm=Object.assign({},WXM0,d.m,{wind:d.wind,rain:d.rain});
if(S.stt)S.stt.wx[k]=1;
if(!quiet){toast(d.n,d.d);if(d.lg||d.mt)warn(d.n.toUpperCase())}
try{A.amb()}catch(e){}}
function wxPick(){const L=WXB[G.bi]||WXB[0],cur=G.wx&&G.wx.k,pool=[];L.forEach(k=>{if(k!=cur)for(let i=0;i<(k=='clear'?2:1);i++)pool.push(k)});return pick(pool)}
function wxInit(){G.bi=biome();G.wp=[];for(let i=0;i<(LQ?70:150);i++)G.wp.push({x:R(0,G.W),y:R(0,G.H),v:R(0,1),u:Math.random(),s:R(0,6)});
if(G.wxb!==G.bi||!G.wx){G.wxb=G.bi;G.wxn=null;G.wxi=1;G.wx=null;wxApply(wxPick(),1)}}

function bolt(x,ty,col){const pts=[[x,-10]],n=8;for(let j=1;j<n;j++)pts.push([x+R(-26,26),-10+(ty+10)*j/n]);pts.push([x+R(-10,10),ty]);
G.fx.push({k:'b',pts,l:.35,m:.35,col});G.fx.push({k:'b',pts,l:.12,m:.12,col:'#fff'})}
function wxLight(){const P=G.P,T=G.E.filter(e=>!e.dead&&e.x<G.W*.95);
if(T.length&&Math.random()<.8){const e=pick(T);bolt(e.x,G.by-40,'#cfe0ff');G.flash=Math.max(G.flash,.55);rl(()=>A.thunder(),.15);G.shake=Math.max(G.shake,5);ring(e.x,G.by-30,90,'#cfe0ff',.5);spark(e.x,G.by-40,'#cfe0ff',14,300);hit(e,P.atk*2.2,1)}
else{bolt(R(40,G.W-40),G.by,'#cfe0ff');G.flash=Math.max(G.flash,.5);rl(()=>A.thunder(),.2)}}
function wxMeteor(){const P=G.P,T=G.E.filter(e=>!e.dead&&e.x<G.W*.95),onP=!T.length||Math.random()<.35,x=onP?P.x+R(-40,40):pick(T).x+R(-30,30),col=WXD[G.wx.k].col;
ring(x,G.by,100,col,1);txt(x,G.by-110,'!',col,26);
later(()=>{G.fx.push({k:'b',pts:[[x+180,-30],[x,G.by-8]],l:.25,m:.25,col});G.fx.push({k:'b',pts:[[x+170,-30],[x,G.by-8]],l:.12,m:.12,col:'#fff'});
ring(x,G.by-10,130,col,.7);spark(x,G.by-20,col,24,380);G.shake=Math.max(G.shake,9);G.flash=Math.max(G.flash,.3);A.boom();
G.E.forEach(e=>{if(!e.dead&&Math.abs(e.x-x)<100)hit(e,G.P.atk*2.5,1)});
const Q=G.P;if(!Q.dead&&Math.abs(Q.x-x)<90){if(Q.iv>0)okDodge();else hurtP(Q.mh*.05,1)}},1)}

if(G.wxn){G.wxi-=rd/1.2;if(G.wxi<=0){G.wxi=0;wxApply(G.wxn);G.wxn=null}}
else{G.wxi=Math.min(1,G.wxi+rd/3);w.t-=rd;if(w.t<=0)G.wxn=wxPick()}
G.wp.forEach(p=>{
if(k=='rain'||k=='rain2'){const s=k=='rain2'?1.5:1;p.y+=(620+p.v*300)*s*rd;p.x-=(110+60*s)*rd}

else if(k=='ember'){p.y-=(35+p.v*60)*rd;p.x+=Math.sin(G.t*2+p.s)*30*rd}
else if(k=='ash'){p.y+=(25+p.v*35)*rd;p.x+=Math.sin(G.t+p.s)*12*rd-8*rd}
else if(k=='spore'){p.y-=(10+p.v*20)*rd;p.x+=Math.sin(G.t*.9+p.s)*18*rd}
else if(k=='fly'){p.x+=Math.sin(G.t*.7+p.s*3)*30*rd;p.y+=Math.cos(G.t*.9+p.s*2)*24*rd}
else if(k=='void'){p.y+=(650+p.v*300)*rd;p.x-=130*rd}
else if(k=='gale'){p.x-=(420+p.v*350)*rd;p.y+=Math.sin(G.t*2+p.s)*8*rd}
else if(k=='heat'){p.y-=(20+p.v*30)*rd;p.x+=Math.sin(G.t*3+p.s)*10*rd}
else{p.x-=(18+p.v*20)*rd;p.y+=Math.sin(G.t+p.s)*8*rd}
if(p.y>G.H*.97){p.y=-10;p.x=R(0,G.W)}else if(p.y<-12){p.y=G.H*.95;p.x=R(0,G.W)}
if(p.x<-12){p.x=G.W+10;p.y=R(0,G.H*.9)}else if(p.x>G.W+12)p.x=-10});
if(P.dead||G.cine)return;const I=G.wxi;
if(m.hp)P.hp=Math.min(P.mh,P.hp+P.mh*m.hp*dt*I);

w.ev-=dt;if(w.ev<=0&&I>.8){if(d.lg){wxLight();w.ev=R(4,9)}else if(d.mt){wxMeteor();w.ev=R(5,9)}else w.ev=5}}

G.wp.forEach(p=>{if((p.v>.55)!=!!front||p.u>I)return;const a=.35+p.v*.6;

else if(k=='dust'){c.strokeStyle='rgba(220,185,140,.5)';c.lineWidth=1.5;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+16+p.v*14,p.y+2);c.stroke()}
else if(k=='gale'){c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=1;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+30+p.v*20,p.y);c.stroke()}
else if(k=='ember'){c.fillStyle=`rgba(255,${120+p.v*100|0},60,${a})`;c.beginPath();c.arc(p.x,p.y,1.2+p.v*2.2,0,7);c.fill()}
else if(k=='ash'){c.fillStyle=`rgba(190,180,175,${a*.8})`;c.beginPath();c.arc(p.x,p.y,1.2+p.v*2,0,7);c.fill()}

else if(k=='fly'){const bl=.3+.7*Math.abs(Math.sin(G.t*2+p.s*3));c.fillStyle=`rgba(225,255,120,${bl})`;c.beginPath();c.arc(p.x,p.y,2.2,0,7);c.fill();c.fillStyle=`rgba(225,255,120,${bl*.25})`;c.beginPath();c.arc(p.x,p.y,6,0,7);c.fill()}
else if(k=='heat'){c.fillStyle='rgba(255,200,120,.25)';c.beginPath();c.arc(p.x,p.y,1.5+p.v*1.5,0,7);c.fill()}
else if(k=='mote'){c.fillStyle=`rgba(255,240,180,${a*.55})`;c.beginPath();c.arc(p.x,p.y,1+p.v*1.5,0,7);c.fill()}});

{id:'pakaiskill',cat:'tempur',t:'Memakai Skill (AUTO & MAN)',k:'skill auto man manual cooldown slot tombol',h:function(){

{id:'hindar',cat:'tempur',t:'Hindar (Dodge)',k:'hindar dodge menghindar kebal hindar sempurna',h:function(){
  return hP('Tombol <b>HINDAR</b> (panah, kiri bawah) membuatmu <b>kebal selama 0,55 detik</b>. Setelah dipakai ada jeda <b>2,2 detik</b>.')+
  hUL(['Selama kebal, semua serangan tidak melukaimu.',

  hTIP('Tunggu sampai lingkaran peringatan hampir habis, baru ketuk HINDAR. Menekan terlalu dini membuang jeda 2,2 detik sehingga tombol belum siap saat serangan datang.')
}},
{id:'ulti',cat:'tempur',t:'Ultimate & Ult 2',k:'ultimate ult ult2 petir tombol terisi charge',h:function(){

  hH('Ult 2 (stage 6 ke atas)')+

{id:'boss',cat:'tempur',t:'Melawan Bos',k:'bos boss serangan telegraf kiamat bayangan waktu membeku retakan tebasan pingsan',h:function(){

{id:'kalah',cat:'tempur',t:'Kalah & Pemulihan',k:'kalah mati hp kritis mundur pulih revive',h:function(){

/* ------------------------------ PERLENGKAPAN ------------------------------ */
{id:'gear',cat:'gear',t:'Perlengkapan & Kelangkaan',k:'perlengkapan item kelangkaan slot upgrade tingkatkan helm zirah senjata sarung cincin sepatu liontin jubah',h:function(){
  var rr=RN.map(function(n,i){return[rar(i),'×'+num(RM[i]),['abu-abu','biru','ungu','emas'][i]]});
  var sl=D.items.map(function(b){return[SLN[b.slot],b.atk||'—',b.hp||'—']});
  return hP('Kael punya <b>8 slot</b> perlengkapan. Tiap item punya <b>kelangkaan</b> dan <b>level</b>.')+
  hTBL(['Kelangkaan','Pengali stat','Warna bingkai'],rr)+
  hTBL(['Slot','ATK dasar','HP dasar'],sl)+
  hH('Rumus')+
  hUL(['Stat item = stat dasar slot × pengali kelangkaan × <b>1,12^level</b>.','Awalan nama menunjukkan level: <b>Kuno</b> (1–11), <b>Prasejarah</b> (12–23), <b>Es</b> (24–35), <b>Hampa</b> (36+).','Senjata Langka ke atas memancarkan <b>aura</b> berwarna di sekitar Kael.'])+
  hH('Meningkatkan item')+
  hP('Ketuk item terpasang di tab Tas, lalu <b>Tingkatkan</b>. Biaya = <b>25 × 1,22^level</b> Gold; tiap level menambah <b>12%</b> stat item.')+
  hTIP('Biaya naik 22% per level sementara stat naik 12%, jadi lebih hemat menaikkan banyak slot secara merata daripada satu slot saja.')+
  hGO('Buka Tab Tas','tab:bag')
}},
{id:'dadu',cat:'gear',t:'Dadu, Pakai & Jual',k:'dadu roll acak auto pakai cerdas jual tas simpanan harga',h:function(){
  return hH('Cara kerja')+
  hUL(['Ketuk <b>Dadu</b> di tab Tas. Gold berkurang, lalu keluar item acak: slot acak, kelangkaan acak, dan level sekitar ½ level progres + level dadu + 0–3.',
       '<b>Level dadu</b> naik tiap 8 putaran (angka di tombol) dan membuat level item hasil dadu makin tinggi.',
       'Biaya tiap putaran naik seiring level dadu dan progresmu.'])+
  hH('Layar hasil')+
  hP('Menampilkan item <b>LAMA</b> dan <b>BARU</b> beserta selisih Power (<span style="color:#1c8a3a"><b>▲ hijau</b></span> naik, <span style="color:#b02a1c"><b>▼ merah</b></span> turun). Pilih <b>Pakai</b> untuk memasang atau <b>Jual</b> untuk menukar jadi Gold.')+
  hH('Otomatisasi')+
  hUL(['<b>Auto-Pakai Cerdas</b>: item langsung dipasang jika Power naik, kalau tidak dijual.','<b>Item Lama: Dijual / Ke Tas</b>: menentukan nasib item yang tergantikan.','<b>Auto</b>: memutar dadu terus sampai Gold habis (berhenti dengan pesan <i>Gold kurang</i>).'])+
  hH('Tas (Simpanan)')+
  hUL(['Item di Simpanan bisa dipasang atau dijual kapan saja.','Jika Simpanan sudah 40 item, item lama yang tergantikan otomatis dijual.','Harga jual = 10 × 1,15^level × (kelangkaan + 1).'])
}},
{id:'senjata',cat:'gear',t:WT.length+' Jenis Senjata',k:'senjata pedang belati kapak tombak tongkat katana sabit pistol busur senapan',h:function(){
  var rows=WT.map(function(w){var cr=w.cr?'+'+Math.round(w.cr*100)+'%':'—';return['<b>'+esc(w.tag||'')+'</b>',w.k&&w.k!=='m'?'Jauh':'Dekat','×'+num(w.am),'×'+num(w.as),cr,esc(w.d.replace(/^[^:]+:\s*/,''))]});
  return hP('Jenis senjata menentukan gaya bertarung. Pada item Senjata hasil Dadu, jenisnya <b>acak</b>. Di Toko kamu bisa <b>menempa senjata Epik</b> dengan jenis pilihanmu (120 Permata).')+
  hTBL(['Senjata','Jarak','ATK','Kecepatan','Krit','Ciri khas'],rows)+
  hTIP('Katana dan Belati unggul di kritikal, Sabit di bertahan hidup, Tongkat untuk spam skill, Kapak dan Senapan untuk ledakan damage dan Ultimate besar.')
}},

/* ------------------------------ SKILL & PET ------------------------------ */
{id:'skill',cat:'skpet',t:'Skill: Daftar & Panggilan',k:'skill panggil scroll tebasan badai ledakan petir waktu distorsi cabikan duplikat level',h:function(){
  var tw=D.skills.reduce(function(t,k){return t+k.w},0);
  var rows=D.skills.map(function(k){return['<b>'+esc(k.name)+'</b><br><span style="font-weight:600">'+esc(k.desc)+'<br><i>'+(SKTYPE[k.kind]||'')+'</i></span>',k.cd+' dtk','×'+num(k.mult),rar(skRarity(k.w))+'<br>'+pct(k.w/tw)]});
  return hTBL(['Skill','Cooldown','Damage','Peluang'],rows)+
  hH('Memanggil')+
  hUL(['<b>Panggil x1</b> = 8 Scroll, <b>x5</b> = 40 Scroll.','<b>Duplikat</b> menambah salinan: tiap <b>2 salinan tambahan</b> = +1 level skill.','Tiap level skill terpasang memberi +5% ATK dan +6% HP, serta +12% damage skill itu.','Sumber Scroll: dungeon <i>Ujian Rune</i>, Toko, misi/pencapaian, dan 5% peluang dari kemenangan.'])+
  hH('Memasang')+
  hP('Di tab Skill, ketuk skill di <b>Koleksi</b> untuk memasang ke slot kosong, ketuk lagi untuk melepas. Slot 3 dan 4 terbuka di stage 4 dan 7.')+
  hGO('Buka Tab Skill','tab:skill')
}},
{id:'pet',cat:'skpet',t:'Pet: Daftar & Panggilan',k:'pet panggil permata serigala rubah elang rusa kucing naga kura beruntun ular phoenix slot',h:function(){
  var tw=D.pets.reduce(function(t,p){return t+p.w},0);
  var rows=D.pets.map(function(p){return['<b>'+esc(p.name)+'</b><br><span style="font-weight:600">'+esc(p.desc)+'</span>',p.cd+' dtk',rar(p.r)+'<br>'+pct(p.w/tw)]});
  var slots=PU.map(function(s,i){return'slot '+(i+1)+' di stage '+s}).join(', ');
  return hTBL(['Pet','Cooldown','Peluang'],rows)+
  hH('Memanggil & memasang')+
  hUL(['<b>Panggil x1</b> = 20 Permata, <b>x5</b> = 90 Permata.','Pet baru <b>otomatis terpasang</b> jika ada slot kosong. Ketuk pet untuk memasang atau melepas.','Slot pet: '+slots+'.','<b>Duplikat</b>: tiap 2 salinan tambahan = +1 level pet.'])+
  hH('Kekuatan pet')+
  hUL(['Tiap pet aktif memberi <b>+3% ATK dan HP</b> per level.','Pet menyerang/membantu sendiri sesuai cooldown, selama ada musuh di jangkauan.','Damage pet = ATK × pengali × (1 + 15% × (level − 1)).','Rusa Cahaya memulihkan 12% + 2% × level HP maksimum; Kura Baja memberi perisai 18% + 3% × level HP maksimum.'])+
  hGO('Buka Tab Pet','tab:pet')
}},

/* ------------------------------ KARAKTER ------------------------------ */
{id:'karakter',cat:'hero',t:'Karakter & Ultimate',k:'karakter kael rin vex zara orin nyx kuro ultimate ult2 rekrut',h:function(){
  var ux={beku:'Membekukan musuh 5 dtk dan memulihkan 30% HP',waktu:'Semua cooldown skill langsung ter-reset'};
  var rows=CH.map(function(c){var u=ULT[c.u];return['<b>'+esc(c.n)+'</b><br><span style="font-weight:600">'+esc(c.d)+'</span>',c.p?c.p+' Permata':'Gratis','ATK +'+Math.round(c.a*100)+'%<br>HP +'+Math.round(c.h*100)+'%','<b>'+esc(u.n)+'</b><br><span style="font-weight:600">'+u.N+' tebasan, hantaman akhir ×'+u.fm+(ux[u.x]?'<br>'+ux[u.x]:'')+'</span>']});
  return hP('Kael adalah karaktermu sejak awal. Karakter lain bisa direkrut dengan Permata. Tiap karakter memberi <b>bonus persen ATK/HP</b> dan <b>Ultimate unik</b>.')+
  hTBL(['Karakter','Harga','Bonus','Ultimate'],rows)+
  hUL(['Ketuk <b>Pakai</b> untuk mengganti karakter aktif (warna dan Ultimate ikut berubah).','Ketuk <b>Ult 2</b> untuk menjadikan Ultimate karakter itu sebagai Ult kedua (terbuka di stage 6).','Jumlah tebasan dan hantaman akhir juga dipengaruhi jenis senjatamu.'])+
  hGO('Buka Tab Karakter','tab:chr')
}},

/* =====================================================================================
   (3) UI PUSAT PANDUAN
   ===================================================================================== */
var TABGUIDE={bag:'gear',skill:'skill',pet:'pet',chr:'karakter',dun:'dungeon',arena:'arena',shop:'toko'};

function plain(h){return h.replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').toLowerCase()}
function artText(a){
  if(!GD.cache)GD.cache={};
  if(GD.cache[a.id]==null){var t='';try{t=plain(a.h())}catch(e){}GD.cache[a.id]=(a.t+' '+a.k+' '+t).toLowerCase()}
  return GD.cache[a.id];
}
function artHtml(a){try{return a.h()}catch(e){return hP('Konten tidak dapat dimuat.')}}

function buildGuide(){
  if(GD.el)return;
  var d=document.createElement('div');d.id='tg';d.className='tg-wrap';d.hidden=true;
  d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','Panduan Bermain');
  d.innerHTML='<div class="tg-hd"><span>PANDUAN BERMAIN</span><button type="button" class="tg-x" aria-label="Tutup">&#10005;</button></div>'+
    '<div class="tg-sr"><input type="search" placeholder="Cari: dadu, bos, cuaca, pet..." autocomplete="off" aria-label="Cari panduan"></div>'+
    '<div class="tg-cats"></div><div class="tg-body"></div>'+
    '<div class="tg-ft"><button type="button">Mulai Tutorial Interaktif</button></div>';
  APP.appendChild(d);GD.el=d;
  q('.tg-x',d).onclick=closeGuide;
  q('.tg-ft button',d).onclick=function(){closeGuide();startTutorial(true)};
  q('.tg-sr input',d).addEventListener('input',function(){GD.q=this.value;renderGuide()});
  q('.tg-cats',d).addEventListener('click',function(e){
    var b=e.target.closest('.tg-c');if(!b)return;
    GD.cat=b.getAttribute('data-c');GD.q='';q('.tg-sr input',d).value='';sfx('ui');renderGuide();q('.tg-body',d).scrollTop=0;
  });
  q('.tg-body',d).addEventListener('click',function(e){
    var go=e.target.closest('.tg-go');
    if(go){doGo(go.getAttribute('data-go'));return}
    var h=e.target.closest('.tg-ah');
    if(h)toggleArt(h.parentNode);
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&GD.open)closeGuide()});
}

function toggleArt(sec,force){
  var open=force!=null?force:!sec.classList.contains('open');
  sec.classList.toggle('open',open);
  sec.querySelector('.tg-ah').setAttribute('aria-expanded',open?'true':'false');
  var body=sec.querySelector('.tg-ab');
  if(open&&!body.getAttribute('data-f')){
    var a=ART.filter(function(x){return x.id===sec.getAttribute('data-id')})[0];
    if(a){body.innerHTML=artHtml(a);body.setAttribute('data-f','1')}
  }
  if(open)sfx('ui');
}

function renderGuide(openId){
  var d=GD.el,qs=GD.q.trim().toLowerCase(),list,info='';
  qa('.tg-c',d).forEach(function(b){b.classList.toggle('on',!qs&&b.getAttribute('data-c')===GD.cat)});
  if(qs){list=ART.filter(function(a){return artText(a).indexOf(qs)>-1});
    var sc=function(a){return(a.t.toLowerCase().indexOf(qs)>-1?2:0)+(a.k.indexOf(qs)>-1?1:0)};
    list.sort(function(a,b){return sc(b)-sc(a)});
    info=list.length?list.length+' hasil untuk &ldquo;'+esc(GD.q.trim())+'&rdquo;':'Tidak ada hasil untuk &ldquo;'+esc(GD.q.trim())+'&rdquo;. Coba kata lain, misalnya <i>dadu</i>, <i>bos</i>, atau <i>pet</i>.'}
  else list=ART.filter(function(a){return a.cat===GD.cat});
  var h=info?'<div class="tg-info">'+info+'</div>':'';
  list.forEach(function(a){h+='<section class="tg-a" data-id="'+a.id+'" id="tga-'+a.id+'"><button type="button" class="tg-ah" aria-expanded="false"><span>'+esc(a.t)+'</span><i></i></button><div class="tg-ab"></div></section>'});
  q('.tg-body',d).innerHTML=h;
  var first=openId?q('#tga-'+openId,d):(list.length&&(qs?list.length===1:true)?q('.tg-a',d):null);
  if(first){toggleArt(first,true);if(openId)setTimeout(function(){first.scrollIntoView({block:'start'})},30)}
}

function openGuide(id){
  if(C.on)return;
  buildGuide();
  try{cm()}catch(e){}
  if(G.dgm&&false)return;
  var a=id&&ART.filter(function(x){return x.id===id})[0];
  GD.q='';q('.tg-sr input',GD.el).value='';
  if(a)GD.cat=a.cat;
  if(!GD.cats){GD.cats=1;q('.tg-cats',GD.el).innerHTML=CATS.map(function(c){return'<button type="button" class="tg-c" data-c="'+c.id+'">'+esc(c.t)+'</button>'}).join('')}
  renderGuide(a?a.id:null);
  GD.el.hidden=false;GD.open=1;PZ.set('guide',1);sfx('ui');
  q('.tg-body',GD.el).scrollTop=0;if(a)setTimeout(function(){var s=q('#tga-'+a.id,GD.el);s&&s.scrollIntoView({block:'start'})},40);
}
function closeGuide(){
  if(!GD.el||!GD.open)return;
  GD.el.hidden=true;GD.open=0;PZ.set('guide',0);sfx('ui');
}
function ctxGuide(){openGuide(TABGUIDE[U.tab]||'tujuan')}

function doGo(act){
  closeGuide();
  if(act==='tut'){startTutorial(true);return}
  if(act==='map'){try{U.map()}catch(e){}return}
  if(act==='quest'){try{U.quest()}catch(e){}return}
  if(act.indexOf('tab:')===0){U.tab=act.slice(4);try{nav_()}catch(e){}}
}

/* =====================================================================================
   (4) TUTORIAL INTERAKTIF (SPOTLIGHT)
   Langkah: {ch:bab, t:judul, b:isi, tg:target, act:{until,hint}, can, alt, needs, skipIf, wait, onEnter, btns}
   - tg: selector | elemen | array | fungsi | {x,y,w,h}. Tanpa tg = kartu di tengah layar.
   - act: langkah aksi; area target bisa diketuk langsung. Selesai saat until() true.
   ===================================================================================== */
var X=C.X;
function nav(tab){return'.nv[onclick*="U.tab=\''+tab+'\'"]'}
function heroRect(){var P=G.P;return{x:P.x-48,y:G.by-120,w:96,h:136}}
function eqTarget(){
  var els=qa('#pc .it[onclick^="U.eqs("]');
  for(var i=0;i<els.length;i++){var m=/U\.eqs\('(\w+)'\)/.exec(els[i].getAttribute('onclick'));if(m&&S.ske.indexOf(m[1])<0)return els[i]}

/* ---------- geometri ---------- */
function appRect(){return APP.getBoundingClientRect()}
function relRect(el){var a=appRect(),r=el.getBoundingClientRect();return{x:r.left-a.left,y:r.top-a.top,w:r.width,h:r.height}}
function isVis(el){var r=el.getBoundingClientRect();if(r.width<2||r.height<2)return false;var cs=getComputedStyle(el);return cs.display!=='none'&&cs.visibility!=='hidden'}
function resolve(t){
  if(typeof t==='function')t=t();
  if(!t)return null;
  if(t.w!=null&&t.x!=null&&!t.getBoundingClientRect)return t;
  var arr=[].concat(t),els=[];
  arr.forEach(function(x){var e=typeof x==='string'?q(x):x;if(e&&e.getBoundingClientRect&&isVis(e))els.push(e)});
  if(!els.length)return null;
  var x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  els.forEach(function(e){var r=relRect(e);x1=Math.min(x1,r.x);y1=Math.min(y1,r.y);x2=Math.max(x2,r.x+r.w);y2=Math.max(y2,r.y+r.h)});
  return{x:x1,y:y1,w:x2-x1,h:y2-y1};
}

/* gulirkan target di dalam panel (#pc) agar terlihat penuh */
function reveal(s){
  try{
    var t=typeof s.tg==='function'?s.tg():s.tg;if(!t||t.w!=null&&!t.getBoundingClientRect)return;
    [].concat(t).forEach(function(x){var e=typeof x==='string'?q(x):x;if(e&&e.getBoundingClientRect&&e.closest&&e.closest('#pc'))e.scrollIntoView({block:'nearest'})});
  }catch(e){}
}

function setB(el,x,y,w,h){el.style.left=x+'px';el.style.top=y+'px';el.style.width=Math.max(0,w)+'px';el.style.height=Math.max(0,h)+'px'}

function layout(){
  if(!C.on)return;
  var s=C.steps[C.i],a=appRect(),W=a.width,H=a.height,hole=null,pad=s.pad==null?6:s.pad;
  if(!C.waiting&&!C.noTarget&&s.tg&&!C.confirm)hole=resolve(s.tg);
  var act=C.mode==='act'&&!C.confirm;
  if(hole){
    var hx=clamp(hole.x-pad,0,W),hy=clamp(hole.y-pad,0,H),hw=Math.min(W-hx,hole.w+pad*2),hh=Math.min(H-hy,hole.h+pad*2);
    setB(C.bl[0],0,0,W,hy);setB(C.bl[1],0,hy+hh,W,H-hy-hh);setB(C.bl[2],0,hy,hx,hh);setB(C.bl[3],hx+hw,hy,W-hx-hw,hh);
    setB(C.bl[4],hx,hy,hw,hh);C.bl[4].style.pointerEvents=act?'none':'auto';
    setB(C.ring,hx,hy,hw,hh);C.ring.style.opacity=1;C.dim.style.opacity=0;
  }else{
    setB(C.bl[0],0,0,W,H);for(var k=1;k<5;k++)setB(C.bl[k],0,0,0,0);
    C.ring.style.opacity=0;C.dim.style.opacity=C.waiting?0:1;
  }
  C.card.style.visibility=C.waiting?'hidden':'visible';
  var cw=C.card.offsetWidth,ch=C.card.offsetHeight,top,cls='nb';
  if(!hole){top=(H-ch)/2}
  else{
    var cy=hy+hh/2,below=cy<H*.5;
    top=below?hy+hh+14:hy-ch-14;cls=below?'up':'dn';
    if(top<8||top+ch>H-8){below=!below;top=below?hy+hh+14:hy-ch-14;cls=below?'up':'dn';
      if(top<8||top+ch>H-8){top=clamp(top,8,H-ch-8);cls='nb'}}
    var left=(W-cw)/2;C.card.style.setProperty('--ax',clamp(hx+hw/2-left,20,cw-20)+'px');
  }
  C.card.className='tc-card '+cls;C.card.style.top=Math.round(top)+'px';
}

/* ---------- alur langkah ---------- */
function go(i){
  if(!C.on)return;
  C.confirm=0;C.advancing=0;
  while(i<C.steps.length){
    var s=C.steps[i];
    if((s.skipIf&&s.skipIf())||(s.needs&&!s.needs())){i++;continue}
    break;
  }
  if(i>=C.steps.length)return endCoach(true);
  C.i=i;var st=C.steps[i];
  if(st.onEnter)st.onEnter();
  if(st.final){var t=T();if(!t.rw&&(REWARD.m||REWARD.sc)){S.m+=REWARD.m||0;S.sc+=REWARD.sc||0;t.rw=1;save();sfx('fan')}}
  C.mode=st.act?((st.can&&!st.can())?'info':'act'):'info';
  C.waiting=0;C.noTarget=0;
  if(st.tg&&st.wait&&!resolve(st.tg)){C.waiting=1;C.waitEnd=now()+st.wait}
  reveal(st);render();layout();
}

function tick(){
  if(!C.on)return;
  var s=C.steps[C.i];if(!s)return;
  if(C.mode==='act'&&!C.advancing&&!C.confirm){
    var ok=false;try{ok=s.act.until()}catch(e){}
    if(ok){C.advancing=1;sfx('chime');setTimeout(function(){if(C.on&&C.steps[C.i]===s)go(C.i+1)},s.delay==null?350:s.delay);return}
  }
  if(C.waiting){
    if(resolve(s.tg)){C.waiting=0;reveal(s);render()}
    else if(now()>C.waitEnd){C.waiting=0;C.noTarget=1;render()}
  }
  layout();
}

function startCoach(steps){
  buildCoach();
  C.steps=steps;C.on=1;C.X=X;C.i=0;
  C.el.hidden=false;
  if(!C.tm)C.tm=setInterval(tick,100);
  go(0);
}
function endCoach(completed){
  C.on=0;C.confirm=0;
  if(C.el)C.el.hidden=true;
  PZ.set('coach',0);
  var t=T();
  if(completed===true){t.done=1;t.skip=0;sfx('fan')}
  else if(completed===false){t.skip=1}
  t.at=now();save();
  lastHint=now();
}

function glow(sel){
  var n=0;
  var iv=setInterval(function(){
    var e=q(sel);n++;
    if(e)e.classList.toggle('tut-glow',n%2===1);
    if(n>=16){clearInterval(iv);if(e)e.classList.remove('tut-glow')}
  },500);
}
function hideHint(){
  if(!hintEl)return;
  var el=hintEl;hintEl=null;clearTimeout(hintTm);
  el.classList.add('out');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},320);
}
function showHint(h){
  var host=q('#stage')||APP;
  hideHint();
  var el=document.createElement('div');el.className='th';el.setAttribute('role','status');el.setAttribute('data-u',h.urgent?'1':'0');
  el.innerHTML='<div class="th-ic">&#10033;</div><div class="th-tx"><b>'+esc(h.t)+'</b><span>'+h.b+'</span></div><div class="th-bt">'+(h.guide?'<button type="button" data-a="more" class="sec">Detail</button>':'')+'<button type="button" data-a="ok">Mengerti</button></div>';
  el.onclick=function(e){
    var a=e.target.getAttribute&&e.target.getAttribute('data-a');
    if(a==='ok'){sfx('ui');hideHint()}
    else if(a==='more'){hideHint();openGuide(h.guide)}
  };
  host.appendChild(el);hintEl=el;sfx('chime');
  hintTm=setTimeout(hideHint,HINT_SHOW);
  if(h.glow)glow(h.glow);
  var t=T();t.seen[h.id]=1;lastHint=now();save();
}

function fresh(){return S.rolls===0&&S.st===1&&!(S.stt&&S.stt.ks>20)&&!(S.pa&&S.pa.length)}
function started(){var s=q('#start');return G.P&&G.running!==undefined&&s&&s.hidden}
function idle(){return!C.on&&!GD.open&&q('#md').hidden&&!(U.r_st>0)&&!G.cine&&!PZ.own.coach&&!PZ.own.guide}

var startedAt=0;
function poll(){
  if(!S||!G.P)return;
  var t=T();
  if(!started()){return}
  if(!startedAt)startedAt=now();
  if(C.on||GD.open)return;
  if(!q('#md').hidden||U.r_st>0||G.cine)return;
  if(now()-startedAt<1500)return;
  /* inisialisasi pertama kali untuk save ini */
  if(!t.init){
    t.init=1;t.t0=now();t.mx=S.st;
    if(fresh()){t.started=now();save();startTutorial(false);return}
    /* pemain lama: tawarkan sekali; sembunyikan petunjuk dasar jika sudah jauh */
    if(S.st>=3)HINTS.forEach(function(h){if(h.basic)t.seen[h.id]=1});
    save();showOffer();return;
  }
  if(!t.hints)return;
  var curU=hintEl&&hintEl.getAttribute('data-u')==='1';
  if(curU)return;
  var gap=now()-lastHint;
  if(gap<6000)return;
  for(var i=0;i<HINTS.length;i++){
    var h=HINTS[i];
    if(t.seen[h.id])continue;
    if(h.after&&now()-(t.t0||0)<h.after)continue;
    if(hintEl&&!h.urgent)continue;
    if(!h.urgent&&gap<HINT_GAP)continue;
    if(!h.dead&&G.P.dead)continue;
    if(!(t.done||t.skip||t.offered)&&!h.urgent)continue;
    var ok=false;try{ok=h.when()}catch(e){}
    if(ok){showHint(h);break}
  }
}

function mountHelpBtn(){
  var ph=q('#ph');if(!ph||q('#phh'))return;
  var st=q('button',ph);if(!st)return;
  var grp=document.createElement('div');grp.id='phh';
  var hb=document.createElement('button');hb.id='phq';hb.type='button';hb.textContent='?';hb.setAttribute('aria-label','Bantuan untuk halaman ini');
  hb.onclick=function(){ctxGuide()};
  ph.replaceChild(grp,st);grp.appendChild(hb);grp.appendChild(st);
}

var _set=U.set;
U.set=function(){
  _set.apply(this,arguments);
  var h=q('#mb h3');if(!h)return;
  h.insertAdjacentHTML('afterend','<button class="bt gd" onclick="TUT.guide()">Panduan Bermain</button><button class="bt bl" onclick="TUT.start(true)">Ulangi Tutorial</button><div class="tg"><span>Petunjuk Otomatis</span><div class="sw '+(T().hints?'on':'')+'" onclick="TUT.hints()"><i></i></div></div>');
};
U.guide=function(){openGuide()};

window.TUT={
  guide:function(id){openGuide(id)},
  close:closeGuide,
  start:function(f){try{cm()}catch(e){}startTutorial(f)},
  hints:function(){var t=T();t.hints=t.hints?0:1;if(!t.hints)hideHint();save();U.set()},
  state:function(){return JSON.parse(JSON.stringify(T()))},
  _:{steps:STEPS,hints:HINTS,art:ART,coach:C}
};

mountHelpBtn();
setInterval(poll,500);
try{
  var op=new URLSearchParams(location.search).get('open');
  if(op==='guide'||op==='help'){var sb=q('#start');if(sb)sb.addEventListener('click',function(){setTimeout(function(){openGuide()},700)},{once:true})}
}catch(e){}
})();

        d.querySelector('button').onclick=function(){window.__upd=1;w.postMessage('SKIP_WAITING')};
        document.body.appendChild(d);var w2=w;

    }).catch(function(){});
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(window.__upd){window.__upd=0;location.reload()}});
  });
}
