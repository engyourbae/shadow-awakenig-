name: Deploy ke GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Isi BUILD di sw.js (agar cache otomatis diperbarui)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" sw.js
      - name: Isi URL situs di meta tag
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          sed -i "s#https://USERNAME.github.io/shadow-awakening/#${URL}#g" index.html robots.txt sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
